<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranocchia</title>
<meta name="description" content="Ranocchia: una piccola sfida al giorno per uscire dalla zona di comfort, con una rana che cresce con te.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#C9E9C0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ranocchia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Stile fumetto piatto: colori pieni, contorni neri spessi, ombre piatte senza sfumature */
:root{
  --bg:#C9E9C0; --bg-shade:#93C788; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#2F5233; --hair:rgba(26,26,26,.16);
  --deep:#1E5A66; --deep-shade:#113B44; --on-deep:#FFFFFF; --soft:#E8F6E3;
  --good:#17703F; --good-bg:#C6EED3; --bad:#B0122C; --bad-bg:#FFD4D4;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --t-fast:.15s; --t-mid:.25s; --t-flip:.6s;
  color-scheme:light;
}
:root[data-palette="ninfea"]{--bg:#F8D6DE;--bg-shade:#E0A2B2;--deep:#8C2D55;--deep-shade:#5E1A38;--soft:#FDEBF0;--muted:#683848}
:root[data-palette="tramonto"]{--bg:#FBD9B4;--bg-shade:#E5AA6E;--deep:#6B3A8C;--deep-shade:#47245E;--soft:#FDEBD8;--muted:#694320}
:root[data-palette="muschio"]{--bg:#DDE4B2;--bg-shade:#B3BE78;--deep:#4A5A1C;--deep-shade:#2F3A10;--soft:#EEF2D6;--muted:#475023}
:root[data-palette="pioggia"]{--bg:#E1DAF4;--bg-shade:#B6A8DE;--deep:#4B3A8F;--deep-shade:#2F2361;--soft:#F1EDFB;--muted:#463B68}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 130px}
button,input,select,textarea{font:inherit;color:inherit}
button,label.btn{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,label.btn:focus-within{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{overflow-wrap:anywhere;hyphens:auto}
h3{font-size:20px}
p{margin:0}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pop{animation:pop var(--t-mid) ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-5deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
@keyframes hop{0%{transform:translateY(12px) scale(.92)}60%{transform:translateY(-8px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* barra superiore */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:6px}
.logo{font-size:30px;font-weight:800;letter-spacing:-.01em;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--bg-shade);font-family:var(--f-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.4}
.chip svg{width:16px;height:16px;flex:none}
.chip.off{background:var(--soft)}

/* card principale con la mascotte */
.hero{position:relative;background:var(--deep);color:var(--on-deep);border:3px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--bg-shade);padding:16px 18px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px;margin-bottom:22px}
.hero .label{color:#fff}
.hero .say{background:#fff;color:var(--ink);border:2.5px solid var(--ink);font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.3;padding:8px 12px;border-radius:16px 16px 4px 16px;margin-top:8px;align-self:center}
.hero .mascot{transform-origin:50% 100%}
.hero .mascot.wig{animation:wiggle 2.8s ease-in-out infinite}
.react{display:flex;justify-content:center;margin:4px 0 8px}
.react .mascot{animation:hop .45s ease-out}

/* pulsanti che si schiacciano */
.btn{border:3px solid var(--ink);border-radius:14px;min-height:52px;padding:12px 16px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;transition:transform var(--t-fast),box-shadow var(--t-fast)}
.btn svg{width:22px;height:22px;flex:none}
.btn-main{background:var(--bg);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.btn-deep{background:var(--deep);color:#fff;box-shadow:0 5px 0 var(--ink)}
.btn-ghost{background:var(--surface);box-shadow:0 4px 0 var(--bg-shade)}
.btn-quiet{background:transparent;border-color:transparent;box-shadow:none;text-decoration:underline;text-underline-offset:3px}
.btn-danger{background:var(--bad-bg);color:var(--bad);box-shadow:0 4px 0 var(--bg-shade)}
.btn-main:active,.btn-deep:active,.btn-ghost:active,.btn-danger:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 var(--bg-shade);transform:none}
.acts{display:grid;gap:12px;margin-top:16px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* carta della sfida */
.flip{perspective:1400px;margin-bottom:8px}
.flip-in{position:relative;min-height:330px;transition:transform var(--t-flip) cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{transform:rotateY(180deg);overflow:hidden}
.cover{width:100%;height:100%;border:3px solid var(--ink);border-radius:22px;background:var(--deep);color:#fff;box-shadow:0 7px 0 var(--bg-shade);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.cover:active{transform:translateY(4px);box-shadow:0 3px 0 var(--bg-shade)}
.cover b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1}
.cover span{font-size:16px}
.cover svg.pads{width:150px;height:110px}
.ch{background:var(--surface);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--bg-shade);padding:18px;display:grid;gap:12px}
.face .ch{height:100%}
.ch h2{font-size:27px;font-weight:800}
.ch .d{font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);font-family:var(--f-mono);font-size:12.5px;background:var(--soft);line-height:1.5}
.tag svg{width:15px;height:15px;flex:none}
.tag.lv{background:var(--bg)}
.why{background:var(--soft);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:15.5px}
.why .label{display:block;margin-bottom:2px}
.plan{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:16px}
.plan svg{width:20px;height:20px;flex:none;margin-top:2px}
.stamp{display:inline-flex;align-items:center;gap:6px;justify-self:start;background:var(--good-bg);color:var(--good);border:2.5px solid var(--ink);border-radius:10px;padding:2px 10px;font-family:var(--f-display);font-weight:800;font-size:16px;transform:rotate(-2deg)}
.stamp svg{width:18px;height:18px}
.stamp.rest{background:var(--soft);color:var(--muted)}
.small{font-size:14px;color:var(--muted)}

/* card secondarie */
.card{background:var(--surface);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--bg-shade);padding:16px;margin-bottom:16px}
.card h3{margin-bottom:6px}
.card p+p{margin-top:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.page-h{margin-bottom:18px}
.page-h h2{font-size:32px;font-weight:800;margin-top:4px}
.page-h p{margin-top:4px;color:var(--muted)}
.back{background:none;border:0;min-height:48px;padding:8px 8px 8px 0;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:6px;font-size:16px;margin-bottom:6px}
.back svg{width:20px;height:20px}
.foot{margin-top:28px;color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.foot svg{width:18px;height:18px;flex:none;margin-top:2px}

/* scelte (chip grandi da toccare) */
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{min-height:48px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--surface);box-shadow:0 3px 0 var(--bg-shade);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;text-align:left;transition:transform var(--t-fast)}
.opt svg{width:20px;height:20px;flex:none}
.opt[aria-pressed="true"]{background:var(--deep);color:#fff;box-shadow:0 3px 0 var(--ink)}
.opt[aria-pressed="true"] .ck{display:inline}
.opt .ck{display:none}
.opt:active{transform:translateY(2px)}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.faceb{min-height:96px;border:3px solid var(--ink);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--bg-shade);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:15px;padding:8px 4px}
.faceb svg{width:44px;height:44px}
.faceb[aria-pressed="true"]{background:var(--bg);box-shadow:0 4px 0 var(--ink);outline:3px solid var(--deep);outline-offset:2px}

/* moduli */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .lab{font-weight:700}
.field .help{font-size:14px;color:var(--muted)}
.field .err{font-size:14px;color:var(--bad);font-weight:700}
.in{width:100%;min-height:52px;border:2.5px solid var(--ink);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:17px}
textarea.in{min-height:110px;resize:vertical}
.in[aria-invalid="true"]{border-color:var(--bad);background:#FFF5F5}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;width:100%;background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:8px 14px;text-align:left;font-weight:700;box-shadow:0 3px 0 var(--bg-shade)}
.switch .tr{width:52px;height:30px;border-radius:999px;border:2.5px solid var(--ink);background:var(--soft);position:relative;flex:none;transition:background var(--t-fast)}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--surface);border:2.5px solid var(--ink);transition:transform var(--t-fast)}
.switch[aria-checked="true"] .tr{background:var(--deep)}
.switch[aria-checked="true"] .tr::after{transform:translateX(22px)}
.switch small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.stack{display:grid;gap:12px}

/* calendario */
.cal-h{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin-bottom:10px}
.cal-h h3{text-align:center;text-transform:capitalize}
.icb{width:48px;height:48px;border:2.5px solid var(--ink);border-radius:12px;background:var(--surface);box-shadow:0 3px 0 var(--bg-shade);display:grid;place-items:center}
.icb svg{width:22px;height:22px}
.icb:disabled{opacity:.4}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-bottom:4px}
.cal .dd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;border-radius:10px;font-variant-numeric:tabular-nums}
.cal .dd.today{outline:2.5px solid var(--ink);outline-offset:-2px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;display:block}
.dot.done{background:var(--deep);border:2px solid var(--ink)}
.dot.skip{border:2.5px solid var(--muted);background:transparent}
.dot.none{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.entry{display:grid;gap:6px}
.entry+.entry{border-top:2px dashed var(--hair);padding-top:12px;margin-top:12px}
.entry .eh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.entry b{font-family:var(--f-display);font-size:18px;line-height:1.2}
.entry .note{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.mface{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.mface svg{width:24px;height:24px}

/* progressi */
.lvcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.meter{height:16px;border-radius:8px;background:var(--soft);border:2.5px solid var(--ink);overflow:hidden}
.meter i{display:block;height:100%;background:var(--deep)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--bg-shade);padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
.bar svg{width:24px;height:24px}
.bar .bt{display:grid;gap:4px;min-width:0}
.bar .bt span{font-weight:700;font-size:16px}
.bar output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;min-width:2ch;text-align:right}
.diffm{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;margin:8px 0 4px}
.diffm span{padding:6px 4px;text-align:center;font-size:14px;font-weight:700;background:var(--soft)}
.diffm span+span{border-left:2.5px solid var(--ink)}
.diffm span.on{background:var(--deep);color:#fff}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border:2.5px solid var(--ink);border-radius:16px;background:var(--surface);padding:10px;display:grid;justify-items:center;text-align:center;gap:4px;box-shadow:0 3px 0 var(--bg-shade)}
.badge .bi{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;background:var(--bg)}
.badge .bi svg{width:28px;height:28px}
.badge b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.badge span{font-size:13px;color:var(--muted);line-height:1.3}
.badge.lock{background:var(--soft);box-shadow:none;border-style:dashed}
.badge.lock .bi{background:var(--surface)}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.wb{border:2.5px solid var(--ink);border-radius:16px;background:var(--surface);box-shadow:0 3px 0 var(--bg-shade);padding:6px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:13px;font-weight:700;min-height:120px;text-align:center}
.wb[aria-pressed="true"]{background:var(--bg);outline:3px solid var(--deep);outline-offset:2px}
.wb:disabled{opacity:1;background:var(--soft);border-style:dashed;box-shadow:none;color:var(--muted);cursor:default}
.wb:disabled svg.mascot{opacity:.35}

/* impostazioni */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pal{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:2.5px solid var(--ink);border-radius:16px;padding:10px;box-shadow:0 4px 0 var(--bg-shade)}
.pal[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.sw{position:relative;height:58px;border-radius:10px;border:2.5px solid var(--ink);display:flex;align-items:center;padding:0 12px;overflow:hidden}
.sw i{position:absolute;right:0;top:0;bottom:0;width:38%;border-left:2.5px solid var(--ink)}
.sw b{font-family:var(--f-display);font-size:24px;color:#1A1A1A;position:relative}
.pt2{display:flex;flex-direction:column;min-width:0}
.pt2 b{font-family:var(--f-display);font-size:17px}
.pt2 span{color:var(--muted);font-size:13px}
.mine{display:grid;grid-template-columns:1fr 48px;gap:10px;align-items:center}
.mine+.mine{border-top:2px dashed var(--hair);padding-top:10px;margin-top:10px}
.mine b{display:block;line-height:1.25}

/* sorpresa */
.gift{background:var(--soft);border:3px solid var(--ink);border-radius:18px;padding:14px;display:grid;gap:8px;justify-items:center;text-align:center;margin-bottom:16px}
.gift .label{color:var(--ink)}
.quote{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.3}
.big-xp{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}

/* barra delle sezioni */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-top:3px solid var(--ink);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;background:none;border:2.5px solid transparent;border-radius:14px;padding:4px 2px;font-size:12.5px;font-weight:700;color:var(--muted);max-width:150px;width:100%;justify-self:center}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink);background:var(--bg);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(92vw,480px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;opacity:0;pointer-events:none;transition:opacity var(--t-mid)}
#toast.on{opacity:1}
.edge{position:fixed;left:0;top:50%;z-index:40;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);display:grid;place-items:center;opacity:0;pointer-events:none}
@media (min-width:700px){.ch h2{font-size:30px}}
</style>

<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- le sfide: "Titolo|Descrizione|minuti|Perché aiuta|i" (i = da fare con qualcuno) ---------- */
/* Nell'ordine di ogni elenco c'è la scala dell'esposizione graduale: dal gradino più piccolo al più grande. */
const RAW = {
cor: {
1: [

/* ---------- serie con "giorno jolly" (1 a settimana) ---------- */
function streak(){
  const t = today(), keys = Object.keys(S.days).sort();
  if(!keys.length) return {n:0, jolly:false};
  const first = keys[0];
  let d = S.days[t] && S.days[t].st === "done" ? t : addDays(t, -1);
  let n = 0; const used = new Set(), saved = new Set();
  let pending = null;
  while(d >= first){
    const r = S.days[d];
    if(r && r.st === "done"){ n++; if(pending){ saved.add(pending); pending = null; } }
    else { const w = weekKey(d); if(used.has(w)) break; used.add(w); pending = w; }
    d = addDays(d, -1);
  }
  return {n, jolly:saved.has(weekKey(t))};
}

function levelWeights(x){
  if(x < 1.5) return {1:.75, 2:.25, 3:0};
  if(x < 2)   return {1:.5, 2:.45, 3:.05};
  if(x < 2.5) return {1:.3, 2:.5, 3:.2};
  return {1:.15, 2:.45, 3:.4};
}
function activeTheme(){ const t = today(); return S.theme && t >= S.theme.from && t <= S.theme.to ? S.theme : null; }
function draw(exclude){
  const t = today(), done = new Set(), recent = new Set();
  for(const k of Object.keys(S.days)){ const r = S.days[k]; if(r.st === "done"){ done.add(r.id); if(gap(k, t) <= 30) recent.add(r.id); } }

  if(!pool.length) pool = allCh().filter(c => !exclude.includes(c.id));
  if(!pool.length) pool = allCh();
  const allowed = S.diff === "auto" ? [1,2,3] : S.levels;
  const W = S.diff === "auto" ? levelWeights(S.lvl) : {1:1, 2:1, 3:1};
  const cats = [...new Set(pool.map(c => c.c))];
  const th = activeTheme();
  const cat = th && cats.includes(th.c) && Math.random() < .65 ? th.c : pick(cats);
  const catPool = pool.filter(c => c.c === cat);
  const lvAvail = [1,2,3].filter(l => allowed.includes(l) && catPool.some(c => c.l === l));
  let lv = null;
  if(lvAvail.length){
    const tot = lvAvail.reduce((a, l) => a + (W[l] || 0), 0);
    if(tot <= 0) lv = Math.min(...lvAvail);
    else { let r = Math.random() * tot; for(const l of lvAvail){ r -= W[l] || 0; if(r <= 0){ lv = l; break; } } lv = lv || lvAvail[lvAvail.length - 1]; }
  }
  let cand = lv ? catPool.filter(c => c.l === lv) : catPool;
  const notRecent = cand.filter(c => !recent.has(c.id)); if(notRecent.length) cand = notRecent;
  const never = cand.filter(c => !done.has(c.id));

  if((cat === "soc" || lv === 3) && never.length) return pick(never.sort((a, b) => a.o - b.o).slice(0, 2));
  return pick(never.length ? never : cand);
}

/* ---------- la mascotte: Ranocchia (disegno originale) ---------- */
// mood: hi · happy · cheer · proud · sleepy · think · gentle. wear: accessorio indossato.
let mid = 0;
function mascot(mood, size, wear){
  mood = mood || "hi";
  if(wear === undefined) wear = S.wear;
  const id = "m" + (++mid), K = "#1A1A1A", G = "#63B84A", GS = "#3E8E2C", BL = "#E4F6C6", CK = "#F49AB2", RED = "#8E2238";
  const body = "M18 106 Q18 70 48 64 Q70 60 92 64 Q122 70 122 106 Q122 142 70 144 Q18 142 18 106 Z";
  const bumps = '<circle cx="44" cy="56" r="20"/><circle cx="96" cy="56" r="20"/>';
  const ARMS = {
    hi:    ["M26 112 Q12 120 12 134", "M114 108 Q132 96 128 74"],
    happy: ["M26 112 Q12 118 10 130", "M114 112 Q128 118 130 130"],
    cheer: ["M26 108 Q10 92 14 70", "M114 108 Q130 92 126 70"],
    proud: ["M26 106 Q6 116 24 128", "M114 106 Q134 116 116 128"],
    sleepy:["M28 116 Q24 128 30 136", "M112 116 Q116 128 110 136"],
    think: ["M26 112 Q12 120 12 134", "M112 116 Q126 112 104 104"],
    gentle:["M26 110 Q32 130 56 126", "M114 110 Q108 130 84 126"]
  }[mood] || [];
  const front = mood === "gentle" || mood === "think";
  const arm = (d) => { const e = d.split(" ").slice(-2).map(Number);
    return `<path d="${d}" stroke="${K}" stroke-width="12" stroke-linecap="round" fill="none"/><path d="${d}" stroke="${G}" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="${e[0]}" cy="${e[1]}" r="6.5" fill="${G}" stroke="${K}" stroke-width="2.6"/>`; };
  const arms = ARMS.map(arm).join("");
  const open = (x, dx, dy) => `<circle cx="${x}" cy="54" r="12.5" fill="#fff" stroke="${K}" stroke-width="2.8"/><circle cx="${x+dx}" cy="${55+dy}" r="6" fill="${K}"/><circle cx="${x+dx+2}" cy="${52+dy}" r="2" fill="#fff"/>`;
  const shut = (x, up) => up ? `<path d="M${x-9} 58 Q${x} 45 ${x+9} 58" fill="none" stroke="${K}" stroke-width="3.6" stroke-linecap="round"/>`
                             : `<path d="M${x-9} 53 Q${x} 61 ${x+9} 53" fill="none" stroke="${K}" stroke-width="3.6" stroke-linecap="round"/>`;
  let eyes, mouth;
  const smile = `<path d="M48 98 Q70 114 92 98" fill="none" stroke="${K}" stroke-width="3.4" stroke-linecap="round"/>`;
  const big = `<path d="M47 95 Q70 124 93 95 Q70 103 47 95 Z" fill="${RED}" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><path d="M60 108 Q70 104 80 108 Q70 116 60 108 Z" fill="#F27A93"/>`;
  switch(mood){
    case "happy":  eyes = open(44, 1, 1) + open(96, -1, 1); mouth = big; break;
    case "cheer":  eyes = shut(44, 1) + shut(96, 1); mouth = big; break;
    case "proud":  eyes = shut(44, 1) + shut(96, 1); mouth = `<path d="M52 97 Q70 110 88 96" fill="none" stroke="${K}" stroke-width="3.4" stroke-linecap="round"/>`; break;
    case "sleepy": eyes = shut(44, 0) + shut(96, 0); mouth = `<ellipse cx="70" cy="102" rx="5" ry="4" fill="${RED}" stroke="${K}" stroke-width="2.6"/>`; break;
    case "think":  eyes = open(44, -3, -4) + open(96, -3, -4); mouth = `<path d="M58 102 Q66 99 76 103" fill="none" stroke="${K}" stroke-width="3.2" stroke-linecap="round"/>`; break;
    case "gentle": eyes = open(44, 1, 2) + open(96, -1, 2); mouth = `<path d="M56 99 Q70 108 84 99" fill="none" stroke="${K}" stroke-width="3.2" stroke-linecap="round"/>`; break;
    default:       eyes = open(44, 1, 1) + open(96, -1, 1); mouth = smile;
  }
  const spark = (x, y, s) => `<path d="M${x} ${y-s} Q${x} ${y} ${x+s} ${y} Q${x} ${y} ${x} ${y+s} Q${x} ${y} ${x-s} ${y} Q${x} ${y} ${x} ${y-s} Z" fill="#fff" stroke="${K}" stroke-width="2"/>`;
  const zz = (x, y, s) => `<path d="M${x} ${y} h${s} l-${s} ${s} h${s}" fill="none" stroke="${K}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  const heart = (x, y, s) => `<path d="M${x} ${y+s*.9} C${x-s*1.5} ${y-s*.1} ${x-s*.8} ${y-s*1.2} ${x} ${y-s*.35} C${x+s*.8} ${y-s*1.2} ${x+s*1.5} ${y-s*.1} ${x} ${y+s*.9} Z" fill="#F0607E" stroke="${K}" stroke-width="2.4" stroke-linejoin="round"/>`;
  let extras = "";
  if(mood === "cheer") extras = spark(14, 44, 8) + spark(128, 40, 7) + spark(22, 18, 5);
  else if(mood === "proud") extras = spark(14, 40, 7) + spark(126, 36, 8);
  else if(mood === "sleepy") extras = zz(112, 22, 9) + zz(126, 8, 6);
  else if(mood === "hi") extras = spark(134, 58, 5);
  else if(mood === "think") extras = `<circle cx="120" cy="30" r="3" fill="#fff" stroke="${K}" stroke-width="2"/><circle cx="128" cy="18" r="5" fill="#fff" stroke="${K}" stroke-width="2"/>`;
  const W = {
    cap:    `<path d="M54 64 Q70 28 86 64 Z" fill="var(--deep,#1E5A66)" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><path d="M52 62 H88" stroke="${K}" stroke-width="6" stroke-linecap="round"/><path d="M52 62 H88" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="70" cy="34" r="6" fill="#fff" stroke="${K}" stroke-width="2.6"/>`,
    crown:  `<path d="M54 63 L55 40 L63 50 L70 34 L77 50 L85 40 L86 63 Z" fill="#F4C430" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><circle cx="70" cy="55" r="3" fill="#E8574A" stroke="${K}" stroke-width="1.8"/>`,
    flower: [0,72,144,216,288].map(a => `<circle cx="${(30 + 8*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(36 + 8*Math.sin(a*Math.PI/180)).toFixed(1)}" r="6.5" fill="#F7A1C4" stroke="${K}" stroke-width="2.2"/>`).join("") + `<circle cx="30" cy="36" r="4.5" fill="#FFD54A" stroke="${K}" stroke-width="2"/>`,
    glasses:`<circle cx="44" cy="54" r="15.5" fill="none" stroke="${K}" stroke-width="3.6"/><circle cx="96" cy="54" r="15.5" fill="none" stroke="${K}" stroke-width="3.6"/><path d="M59.5 52 Q70 45 80.5 52" fill="none" stroke="${K}" stroke-width="3.6"/>`,
    bow:    `<path d="M70 118 L53 109 L53 127 Z M70 118 L87 109 L87 127 Z" fill="var(--deep,#1E5A66)" stroke="${K}" stroke-width="2.8" stroke-linejoin="round"/><circle cx="70" cy="118" r="4.5" fill="#fff" stroke="${K}" stroke-width="2.4"/>`,
    leaf:   `<path d="M70 64 V24" stroke="${K}" stroke-width="6" stroke-linecap="round"/><path d="M70 64 V24" stroke="${GS}" stroke-width="2.4" stroke-linecap="round"/><path d="M20 26 Q70 -2 120 26 Q96 34 74 28 L70 18 L64 30 Q42 34 20 26 Z" fill="#7CCB5E" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><path d="M40 22 Q56 16 66 20 M100 22 Q86 16 76 20" fill="none" stroke="${GS}" stroke-width="2.2" stroke-linecap="round"/>`
  };
  const acc = wear && W[wear] ? W[wear] : "";
  const label = {hi:"saluta", happy:"è felice", cheer:"festeggia", proud:"è fiera", sleepy:"sonnecchia", think:"ci pensa", gentle:"ti incoraggia"}[mood] || "";
  return `<svg class="mascot" viewBox="0 0 140 160" width="${size}" height="${Math.round(size*160/140)}" role="img" aria-label="Ranocchia ${label}">
    <defs><clipPath id="${id}"><path d="${body}"/>${bumps}</clipPath></defs>
    ${extras}
    <ellipse cx="42" cy="146" rx="18" ry="7" fill="${G}" stroke="${K}" stroke-width="3"/><ellipse cx="98" cy="146" rx="18" ry="7" fill="${G}" stroke="${K}" stroke-width="3"/>
    ${front ? "" : arms}
    <g fill="${K}" stroke="${K}" stroke-width="7" stroke-linejoin="round"><path d="${body}"/>${bumps}</g>
    <g fill="${G}"><path d="${body}"/>${bumps}</g>
    <g clip-path="url(#${id})">
      <ellipse cx="70" cy="128" rx="34" ry="19" fill="${BL}"/>
      <path d="M106 34 Q142 80 116 150 L150 150 L150 20 Z" fill="${GS}"/>
      <circle cx="64" cy="74" r="4" fill="${GS}"/><circle cx="76" cy="80" r="2.6" fill="${GS}"/>
    </g>
    <path d="M30 88 Q31 78 38 73" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <ellipse cx="32" cy="98" rx="7" ry="4.5" fill="${CK}"/><ellipse cx="108" cy="98" rx="7" ry="4.5" fill="${CK}"/>
    ${eyes}${mouth}
    ${front ? arms : ""}
    ${mood === "gentle" ? heart(70, 124, 9) : ""}
    ${acc}
  </svg>`;
}

/* ---------- navigazione: il gesto "indietro" del telefono segue le schermate ---------- */
const DEPTH = {home:0, plan:1, reflect:1, yay:1, diary:1, progress:1, settings:1, recap:2, mine:2};
let curDepth = 0, fromPop = false, skipPop = null;
function screen(st){
  if(fromPop) return;
  const d = DEPTH[st.s];
  try{
    if(d > curDepth) history.pushState(st, "");
    else if(d === curDepth) history.replaceState(st, "");
    else { skipPop = st; history.go(d - curDepth); }
  }catch(e){}
  curDepth = d;
}
function showState(st){
  st = st || {s:"home"};
  const r = S.days[today()];
  if(st.s === "plan" && r && r.st === "flip") plan();
  else if(st.s === "reflect" && r && r.st === "ok") reflect();
  else if(st.s === "diary") diary(st.m);
  else if(st.s === "progress") progress();
  else if(st.s === "settings") settings();
  else if(st.s === "recap") recap();
  else if(st.s === "mine") mine();
  else home();
}
window.addEventListener("popstate", (e) => {
  if(skipPop){ const st = skipPop; skipPop = null; try{ history.replaceState(st, ""); }catch(err){} return; }
  let st = e.state || {s:"home"};
  if(st.s === "yay") st = {s:"home"};     // la festa non si riprende: si torna a Oggi
  fromPop = true;
  try{ showState(st); } finally { fromPop = false; }
  curDepth = DEPTH[st.s] || 0;
});
function mount(v, focus){
  if(Date.now() - (toast.at || 0) > 400) document.getElementById("toast").classList.remove("on");
  app.innerHTML = ""; app.appendChild(v);
  v.querySelectorAll(".tabbar").forEach(el => app.appendChild(el));
  window.scrollTo(0, 0);
  if(focus !== false){ try{ app.focus({preventScroll:true}); }catch(e){} }
}
function tabBar(active){
  const tabs = [["home","Oggi",ICON.card,home],["diary","Diario",ICON.book,() => diary()],["progress","Progressi",ICON.chart,progress],["settings","Impostazioni",ICON.gear,() => settings()]];
  const bar = $(`<nav class="tabbar" aria-label="Sezioni">${tabs.map(([id, l, ic]) => `<button class="tab ${id === active ? "on" : ""}" data-t="${id}" ${id === active ? 'aria-current="page"' : ""}>${ic}<span>${l}</span></button>`).join("")}</nav>`);
  bar.querySelectorAll(".tab").forEach(b => b.onclick = () => { if(b.dataset.t !== active) tabs.find(t => t[0] === b.dataset.t)[3](); else window.scrollTo({top:0, behavior:reduced() ? "auto" : "smooth"}); });
  return bar;
}
const backBtn = (label) => `<button class="back" id="bk">${ICON.back}${esc(label)}</button>`;

const PADS = `<svg class="pads" viewBox="0 0 150 110" aria-hidden="true"><ellipse cx="75" cy="78" rx="62" ry="22" fill="#7CCB5E" stroke="#1A1A1A" stroke-width="3"/><path d="M75 78 L118 62" stroke="#1A1A1A" stroke-width="3"/><ellipse cx="30" cy="34" rx="22" ry="8" fill="#7CCB5E" stroke="#1A1A1A" stroke-width="3"/><ellipse cx="124" cy="26" rx="18" ry="6.5" fill="#7CCB5E" stroke="#1A1A1A" stroke-width="3"/><text x="75" y="70" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-weight="800" font-size="54" fill="#fff" stroke="#1A1A1A" stroke-width="3" paint-order="stroke">?</text></svg>`;

/* ---------- OGGI ---------- */
let sleepyOnce = false;
function home(){
  screen({s:"home"});
  const t = today(), r = todayRec(), c = chOf(r), st = streak(), th = activeTheme();
  let mood = "hi", say = pick(GREET);
  if(sleepyOnce){ mood = "sleepy"; say = "Mi ero appisolata sulla ninfea… che bello rivederti!"; sleepyOnce = false; }
  else if(r.st === "flip"){ mood = "think"; say = "Che ne dici? Scegli tu."; }
  else if(r.st === "ok"){ mood = "happy"; say = "Hai un piano. Ce la puoi fare!"; }
  else if(r.st === "done"){ mood = Object.values(S.badges).includes(t) ? "proud" : "happy"; say = "Fatto! Che salto!"; }
  else if(r.st === "skip"){ mood = "gentle"; say = pick(REST); }
  const dow = toDate(t).getDay(), isNew = dow === 1 || toDate(t).getDate() === 1;
  const offerTheme = isNew && !th && S.themeOffer !== t;
  const week = Object.keys(S.days).filter(k => gap(k, t) < 7 && S.days[k].st === "done").length;
  const offerRecap = (dow === 0 || dow === 1) && week > 0 && (!S.recapSeen || gap(S.recapSeen, t) > 2);
  const v = $(`<div class="pop">
    <header class="top">
      <div class="brand">${mascot("happy", 44)}<h1 class="logo">Ranocchia</h1></div>
      <div class="stats">
        <span class="chip" aria-label="Serie: ${st.n} giorni">${ICON.flame}${st.n}</span>
        <span class="chip ${st.jolly ? "off" : ""}" aria-label="Giorno jolly della settimana: ${st.jolly ? "già usato" : "disponibile"}">${ICON.shield}${st.jolly ? "Jolly usato" : "Jolly pronto"}</span>
      </div>
    </header>
    <section class="hero" aria-label="Ranocchia">
      <div><span class="label">${esc(fmtDay(t))}</span><p class="say">${esc(say)}</p></div>
      ${mascot(mood, 108).replace('class="mascot"', 'class="mascot wig"')}
    </section>
    <section id="card" aria-label="La sfida di oggi"></section>
    ${th ? `<p class="small" style="margin-top:14px">${ICON.cal.replace("<svg", '<svg width="16" height="16" style="vertical-align:-3px"')} ${esc(THEMES[th.c])}, fino a ${esc(fmtDay(th.to, {weekday:"long", day:"numeric"}))}.</p>` : ""}
    ${offerTheme ? `<div class="card" style="margin-top:22px" id="theme">
      <span class="label">Nuovo inizio</span>
      <h3>Ti va una settimana a tema?</h3>
      <p>Per 7 giorni ti propongo più spesso sfide di una categoria. È facoltativo.</p>
      <div class="opts" style="margin-top:12px">${CATS.map(k => `<button class="opt" data-th="${k.id}">${catIcon(k.id)}${esc(k.name)}</button>`).join("")}</div>
      <div class="acts"><button class="btn btn-quiet" id="nothx">No, grazie</button></div>
    </div>` : ""}
    ${offerRecap ? `<div class="card" style="margin-top:22px">
      <span class="label">Riepilogo</span><h3>La tua settimana sullo stagno</h3>
      <p>${week === 1 ? "1 sfida fatta" : week + " sfide fatte"} negli ultimi 7 giorni. Rivediamo insieme i momenti migliori?</p>
      <div class="acts"><button class="btn btn-ghost" id="recap">${ICON.star}Apri il riepilogo</button></div>
    </div>` : ""}
    <p class="foot">${ICON.eye}<span>Le tue sfide sono private: restano solo su questo telefono, nessuno le vede.</span></p>
  </div>`);
  renderCard(v.querySelector("#card"), r, c);
  v.querySelectorAll("[data-th]").forEach(b => b.onclick = () => {
    S.theme = {c:b.dataset.th, from:t, to:addDays(t, 6)}; S.themeOffer = t;
    // la sfida di oggi resta quella pescata: il tema vale da domani se l'hai già girata
    if(r.st === "new"){ S.days[t] = newRec(draw([])); }
    save(); toast(THEMES[b.dataset.th] + ": si parte!"); home();
  });
  const nt = v.querySelector("#nothx"); if(nt) nt.onclick = () => { S.themeOffer = t; save(); home(); };
  const rc = v.querySelector("#recap"); if(rc) rc.onclick = recap;
  v.appendChild(tabBar("home"));
  mount(v, false);
}
function renderCard(box, r, c){
  if(r.st === "new"){
    box.innerHTML = `<div class="flip" id="flip"><div class="flip-in">
      <div class="face front"><button class="cover" id="turn" aria-label="Gira la carta e scopri la sfida di oggi">${PADS}<b>La sfida di oggi</b><span>Tocca per girarla</span></button></div>
      <div class="face back" aria-hidden="true"><div class="ch">${chBody(c)}</div></div>
    </div></div>`;
    box.querySelector("#turn").onclick = () => {
      r.st = "flip"; save();
      if(reduced()){ home(); return; }
      box.querySelector("#flip").classList.add("on");
      const id = r.id;
      setTimeout(() => { const now = S.days[today()]; if(now && now.id === id && history.state && history.state.s === "home") home(); }, 650);
    };
    return;
  }
  if(r.st === "flip"){
    box.innerHTML = `<div class="ch">${chBody(c)}</div>
      <div class="acts">
        <button class="btn btn-deep" id="yes">${ICON.check}Accetto</button>
        <div class="acts2">
          <button class="btn btn-ghost" id="again" ${r.rr ? "disabled" : ""} aria-describedby="rrh">${ICON.shuffle}Ripesca</button>
          <button class="btn btn-ghost" id="no">${ICON.moon}Non oggi</button>
        </div>
        <p class="small" id="rrh">${r.rr ? "Hai già ripescato oggi: questa è la sfida del giorno." : "Puoi ripescare una volta al giorno."}</p>
      </div>`;
    box.querySelector("#yes").onclick = plan;
    box.querySelector("#again").onclick = () => {
      if(r.rr) return;
      const nc = draw(r.drawn || [r.id]);
      S.days[today()] = newRec(nc, {st:"flip", rr:1, drawn:(r.drawn || [r.id]).concat(nc.id)});
      save(); toast("Ecco un'altra sfida."); home();
    };
    box.querySelector("#no").onclick = () => { r.st = "skip"; S.lvl = Math.max(1, S.lvl - .3); save(); home(); };
    return;
  }
  if(r.st === "ok"){
    box.innerHTML = `<div class="ch">${chBody(c)}
        <p class="plan">${ICON.pin}<span><b>Il tuo piano:</b> ${esc(r.plan || "quando ti va, oggi")}</span></p></div>
      <div class="acts">
        <button class="btn btn-deep" id="did">${ICON.check}Fatto!</button>
        <div class="acts2"><button class="btn btn-ghost" id="replan">${ICON.clock}Cambia piano</button><button class="btn btn-ghost" id="no">${ICON.moon}Non oggi</button></div>
      </div>`;
    box.querySelector("#did").onclick = reflect;
    box.querySelector("#replan").onclick = () => { r.st = "flip"; save(); plan(); };
    box.querySelector("#no").onclick = () => { r.st = "skip"; S.lvl = Math.max(1, S.lvl - .3); save(); home(); };
    return;
  }
  if(r.st === "done"){
    box.innerHTML = `<div class="ch">
        <span class="stamp">${ICON.check}Fatta!</span>
        ${tagsOf(c)}<h2>${esc(c.t)}</h2>
        ${r.mood ? `<span class="mface">${faceSvg(r.mood)}${esc(MOODS[r.mood])}</span>` : ""}
        ${r.note ? `<p class="why"><span class="label">La tua nota</span>${esc(r.note)}</p>` : ""}
        <p>Domani ti aspetta una nuova sfida a sorpresa.</p>
      </div>
      <div class="acts"><button class="btn btn-ghost" id="dia">${ICON.book}Apri il diario</button></div>`;
    box.querySelector("#dia").onclick = () => diary();
    return;
  }
  // skip
  box.innerHTML = `<div class="ch">
      <span class="stamp rest">${ICON.moon}Oggi riposo</span>
      <h2>Va bene così.</h2>
      <p>Saltare un giorno non cancella niente: hai un giorno jolly a settimana e la prossima sfida sarà un po' più leggera.</p>
    </div>
    <div class="acts"><button class="btn btn-ghost" id="undo">${ICON.undo}Ci ho ripensato</button></div>`;
  box.querySelector("#undo").onclick = () => { r.st = "flip"; S.lvl = Math.min(3, S.lvl + .3); save(); home(); };
}

/* ---------- QUANDO E DOVE (intenzione di attuazione) ---------- */
function plan(){
  const r = S.days[today()]; if(!r || (r.st !== "flip" && r.st !== "ok")) return home();
  screen({s:"plan"});
  const c = chOf(r);
  let choice = r.plan || "";
  const v = $(`<div class="pop">
    ${backBtn("Oggi")}
    <div class="page-h"><span class="label">Hai accettato</span><h2>Quando e dove la farai?</h2>
      <p>${esc(c.t)}. Decidere un momento preciso rende molto più probabile farlo davvero.</p></div>
    <div class="opts" role="group" aria-label="Frasi pronte">${PLANS.map(p => `<button class="opt" aria-pressed="${p === choice}" data-p="${esc(p)}"><span class="ck">${ICON.check}</span>${esc(p)}</button>`).join("")}</div>
    <div class="field" style="margin-top:18px">
      <label for="own">Oppure scrivilo con parole tue</label>
      <input class="in" id="own" maxlength="80" autocomplete="off" placeholder="Es. Dopo la riunione delle 11, alla macchinetta" value="${PLANS.includes(choice) ? "" : esc(choice)}">
      <span class="help">Formula utile: «Quando succede X, farò Y».</span>
    </div>
    <div class="acts">
      <button class="btn btn-deep" id="ok">${ICON.check}Salva il piano</button>
      <button class="btn btn-quiet" id="skip">Salta, decido dopo</button>
    </div>
  </div>`);
  const own = v.querySelector("#own");
  v.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    choice = b.dataset.p; own.value = "";
    v.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  own.oninput = () => { if(own.value.trim()){ choice = ""; v.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", "false")); } };
  const go = (p) => { r.st = "ok"; r.plan = p; save(); toast("Piano salvato. Ti aspetto lì!"); home(); };
  v.querySelector("#ok").onclick = () => go(own.value.trim() || choice);
  own.onkeydown = (e) => { if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); go(own.value.trim() || choice); } };
  v.querySelector("#skip").onclick = () => go("");
  v.querySelector("#bk").onclick = home;
  mount(v);
}

/* ---------- RIFLESSIONE ---------- */
function reflect(){
  const r = S.days[today()]; if(!r || r.st !== "ok") return home();
  screen({s:"reflect"});
  const c = chOf(r), q = pick(ASK);
  let mood = 0;
  const v = $(`<div class="pop">
    ${backBtn("Oggi")}
    <div class="page-h"><span class="label">${esc(c.t)}</span><h2>Com'è andata?</h2></div>
    <div class="react">${mascot("happy", 100)}</div>
    <div class="faces" role="group" aria-label="Come è andata">${[1,2,3].map(n => `<button class="faceb" aria-pressed="false" data-m="${n}">${faceSvg(n)}<span>${MOODS[n]}</span></button>`).join("")}</div>
    <div class="field" style="margin-top:18px">
      <label for="note">${esc(q)}</label>
      <textarea class="in" id="note" maxlength="600" placeholder="Due righe bastano."></textarea>
      <span class="help">Facoltativo. Scrivere aiuta ad assaporare il momento (+5 XP).</span>
    </div>
    <div class="acts"><button class="btn btn-deep" id="save">${ICON.star}Salva e festeggia</button></div>
  </div>`);
  v.querySelectorAll(".faceb").forEach(b => b.onclick = () => {
    mood = Number(b.dataset.m);
    v.querySelectorAll(".faceb").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  v.querySelector("#save").onclick = () => complete(mood, v.querySelector("#note").value);
  v.querySelector("#bk").onclick = home;
  mount(v);
}
function complete(mood, note){
  const t = today(), r = S.days[t];
  if(!r || r.st === "done") return home();
  const before = lvInfo(totalXp()).n, firstEver = doneDays().length === 0;
  r.st = "done"; r.mood = mood || 0; r.note = String(note || "").trim().slice(0, 600);
  r.xp = LV[r.l].xp + (r.note ? 5 : 0); r.at = Date.now();
  S.lvl = Math.min(3, S.lvl + (r.l >= Math.round(S.lvl) ? .2 : .1));
  S.best = Math.max(S.best || 0, streak().n);
  const badges = checkBadges();
  const after = lvInfo(totalXp()).n;
  // sorpresa: la prima volta sempre, poi circa 1 volta su 3. Mai a pagamento, mai con il timer.
  let surprise = null;
  const locked = ACC.filter(a => !S.acc.includes(a.id));
  if(firstEver || Math.random() < .33){
    if(locked.length && (firstEver || Math.random() < .6)){ const a = pick(locked); S.acc.push(a.id); surprise = {type:"acc", a}; }
    else surprise = {type:"quote", text:pick(QUOTES)};
  }
  save();
  yay({xp:r.xp, up:after > before ? after : 0, badges, surprise});
}
function yay(res){
  screen({s:"yay"});
  const st = streak(), L = lvInfo(totalXp());
  const proud = res.up || res.badges.length;
  const v = $(`<div class="pop">
    <div class="react">${mascot(proud ? "proud" : "cheer", 150)}</div>
    <div class="page-h" style="text-align:center"><span class="label">Sfida completata</span><h2>${esc(pick(PRAISE))}</h2></div>
    <p class="big-xp">+${res.xp} XP</p>
    <div class="card" style="margin-top:16px">
      <p><b>${esc(L.name)}</b> · livello ${L.n}</p>
      <div class="meter" style="margin:8px 0" role="progressbar" aria-label="Avanzamento del livello" aria-valuemin="0" aria-valuemax="${L.need}" aria-valuenow="${L.into}"><i style="width:${Math.round(L.into / L.need * 100)}%"></i></div>
      <p class="small">${L.into} di ${L.need} XP per il prossimo livello · serie di ${st.n} ${st.n === 1 ? "giorno" : "giorni"}</p>
    </div>
    ${res.up ? `<div class="gift"><span class="label">Nuovo livello</span><p class="quote">Sei al livello ${res.up}: ${esc(lvInfo(totalXp()).name)}!</p></div>` : ""}
    ${res.badges.map(b => `<div class="gift"><span class="label">Nuovo traguardo</span><div class="badge" style="box-shadow:none"><span class="bi">${ICON[b.icon]}</span><b>${esc(b.name)}</b><span>${esc(b.how)}</span></div></div>`).join("")}
    ${res.surprise && res.surprise.type === "acc" ? `<div class="gift"><span class="label">${ICON.gift.replace("<svg", '<svg width="16" height="16" style="vertical-align:-3px"')} Sorpresa!</span>
        ${mascot("happy", 90, res.surprise.a.id)}<p class="quote">Ranocchia ha trovato: ${esc(res.surprise.a.name)}</p>
        <button class="btn btn-ghost" id="wear">Indossalo adesso</button></div>` : ""}
    ${res.surprise && res.surprise.type === "quote" ? `<div class="gift"><span class="label">Una frase per te</span><p class="quote">«${esc(res.surprise.text)}»</p></div>` : ""}
    <div class="acts"><button class="btn btn-deep" id="home">Torna a Oggi</button></div>
  </div>`);
  const w = v.querySelector("#wear");
  if(w) w.onclick = () => { S.wear = res.surprise.a.id; save(); w.disabled = true; w.textContent = "Indossato!"; };
  v.querySelector("#home").onclick = home;
  mount(v);
}

/* ---------- DIARIO ---------- */
function diary(m){
  const t = today();
  m = m || t.slice(0, 7);
  screen({s:"diary", m});
  const [y, mo] = m.split("-").map(Number);
  const first = new Date(y, mo - 1, 1), days = new Date(y, mo, 0).getDate(), lead = (first.getDay() + 6) % 7;
  const prevM = today(new Date(y, mo - 2, 1)).slice(0, 7), nextM = today(new Date(y, mo, 1)).slice(0, 7);
  const firstKey = Object.keys(S.days).sort()[0];
  let cells = "";
  for(let i = 0; i < lead; i++) cells += "<span></span>";
  for(let d = 1; d <= days; d++){
    const k = m + "-" + String(d).padStart(2, "0"), r = S.days[k];
    const cls = r && r.st === "done" ? "done" : r && (r.st === "skip" || k < t) ? "skip" : "none";
    const lab = r && r.st === "done" ? "sfida fatta" : r && r.st === "skip" ? "non oggi" : "";
    cells += `<span class="dd ${k === t ? "today" : ""}" ${lab ? `aria-label="${d}: ${lab}"` : ""}>${d}<i class="dot ${r ? cls : "none"}"></i></span>`;
  }
  const keys = Object.keys(S.days).filter(k => k.startsWith(m) && (S.days[k].st === "done" || S.days[k].st === "skip")).sort().reverse();
  const doneN = keys.filter(k => S.days[k].st === "done").length;
  const v = $(`<div class="pop">
    <div class="page-h"><span class="label">Diario</span><h2>Le tue sfide</h2><p>${doneDays().length} completate finora. Solo tu le vedi.</p></div>
    <div class="card">
      <div class="cal-h">
        <button class="icb" id="pm" aria-label="Mese precedente" ${firstKey && prevM < firstKey.slice(0, 7) ? "disabled" : ""}>${ICON.back}</button>
        <h3>${esc(first.toLocaleDateString("it-IT", {month:"long", year:"numeric"}))}</h3>
        <button class="icb" id="nm" aria-label="Mese successivo" ${nextM > t.slice(0, 7) ? "disabled" : ""}>${ICON.next}</button>
      </div>
      <div class="cal" aria-label="Calendario del mese: ${doneN} sfide fatte">${["L","M","M","G","V","S","D"].map(x => `<span class="wd" aria-hidden="true">${x}</span>`).join("")}${cells}</div>
      <div class="legend"><span><i class="dot done"></i>Fatta</span><span><i class="dot skip"></i>Saltata o riposo</span></div>
    </div>
    <div class="acts" style="margin-bottom:8px"><button class="btn btn-ghost" id="recap">${ICON.star}Riepilogo della settimana</button></div>
    <div class="sec-h"><h3>Questo mese</h3><span class="label">${doneN} fatte</span></div>
    ${keys.length ? `<div class="card">${keys.map(k => { const r = S.days[k], c = chOf(r);
      return r.st === "done" ? `<article class="entry">
        <div class="eh"><span class="label">${esc(fmtDay(k, {weekday:"short", day:"numeric", month:"short"}))}</span>${r.mood ? `<span class="mface">${faceSvg(r.mood)}${esc(MOODS[r.mood])}</span>` : ""}</div>
        <b>${esc(c.t)}</b>
        <div class="tags"><span class="tag">${catIcon(c.c)}${esc(catName(c.c))}</span><span class="tag lv">${esc(LV[c.l].name)}</span>${r.plan ? `<span class="tag">${ICON.pin}${esc(r.plan)}</span>` : ""}</div>
        ${r.note ? `<p class="note">${esc(r.note)}</p>` : ""}
      </article>` : `<article class="entry"><div class="eh"><span class="label">${esc(fmtDay(k, {weekday:"short", day:"numeric", month:"short"}))}</span></div><p class="small">${ICON.moon.replace("<svg", '<svg width="16" height="16" style="vertical-align:-3px"')} Giorno di riposo. Va bene così.</p></article>`; }).join("")}</div>`
    : `<div class="card" style="text-align:center"><div class="react">${mascot("think", 90)}</div><p>Qui troverai le sfide fatte, con le tue note.</p><div class="acts"><button class="btn btn-deep" id="go">Vai alla sfida di oggi</button></div></div>`}
  </div>`);
  v.querySelector("#pm").onclick = () => diary(prevM);
  v.querySelector("#nm").onclick = () => diary(nextM);
  v.querySelector("#recap").onclick = recap;
  const g = v.querySelector("#go"); if(g) g.onclick = home;
  v.appendChild(tabBar("diary"));
  mount(v);
}

/* ---------- RIEPILOGO DELLA SETTIMANA (assaporare) ---------- */
function recap(){
  screen({s:"recap"});
  const t = today(); S.recapSeen = t; save();
  const keys = Object.keys(S.days).filter(k => gap(k, t) < 7 && gap(k, t) >= 0 && S.days[k].st === "done").sort();
  const rs = keys.map(k => S.days[k]);
  const xp = rs.reduce((a, r) => a + (r.xp || 0), 0);
  const best = keys.slice().sort((a, b) => (S.days[b].mood || 0) - (S.days[a].mood || 0) || (S.days[b].note ? 1 : 0) - (S.days[a].note ? 1 : 0)).slice(0, 3);
  const cats = [...new Set(rs.map(r => r.c))];
  const v = $(`<div class="pop">
    ${backBtn("Indietro")}
    <div class="page-h"><span class="label">Ultimi 7 giorni</span><h2>I tuoi momenti migliori</h2></div>
    <div class="react">${mascot(rs.length ? "proud" : "gentle", 120)}</div>
    <div class="kpis"><div class="kpi"><b>${rs.length}</b><span>sfide fatte</span></div><div class="kpi"><b>${xp}</b><span>XP guadagnati</span></div></div>
    ${rs.length ? `<div class="card"><h3>Da ricordare</h3>${best.map(k => { const r = S.days[k];
      return `<article class="entry"><div class="eh"><span class="label">${esc(fmtDay(k, {weekday:"long", day:"numeric"}))}</span>${r.mood ? `<span class="mface">${faceSvg(r.mood)}${esc(MOODS[r.mood])}</span>` : ""}</div><b>${esc(chOf(r).t)}</b>${r.note ? `<p class="note">${esc(r.note)}</p>` : ""}</article>`; }).join("")}</div>
      <div class="card"><p>Hai toccato ${cats.length} ${cats.length === 1 ? "categoria" : "categorie"}: ${esc(cats.map(catName).join(", "))}.</p><p>Prenditi un momento per rileggere: ricordare i successi li rende più forti.</p></div>`
    : `<div class="card"><p>Questa settimana è stata tranquilla, e va bene così. La prossima sfida ti aspetta quando vuoi.</p></div>`}
  </div>`);
  v.querySelector("#bk").onclick = () => history.back();
  mount(v);
}

/* ---------- PROGRESSI ---------- */

  screen({s:"progress"});
  const xp = totalXp(), L = lvInfo(xp), st = streak(), ds = doneDays(), rs = ds.map(k => S.days[k]);
  S.best = Math.max(S.best || 0, st.n);
  const per = CATS.map(c => ({c, n:rs.filter(r => r.c === c.id).length}));
  const max = Math.max(1, ...per.map(p => p.n));

  const v = $(`<div class="pop">
    <div class="page-h"><span class="label">Progressi</span><h2>${esc(L.name)}</h2><p>Livello ${L.n} · ${xp} XP in tutto</p></div>

      ${mascot(ds.length ? "proud" : "hi", 96)}

        <p class="small" style="margin-top:6px">${L.into} di ${L.need} XP per il livello ${L.n + 1}</p>

    <div class="kpis">
      <div class="kpi"><b>${st.n}</b><span>giorni di fila</span></div>

      <div class="kpi"><b>${ds.length}</b><span>sfide fatte</span></div>

    </div>
    <div class="card">
      <h3>Difficoltà</h3>
      ${S.diff === "auto" ? `<div class="diffm" aria-label="Difficoltà attuale: ${esc(LV[lvNow].name)}">${[1,2,3].map(l => `<span class="${l === lvNow ? "on" : ""}">${LV[l].name}</span>`).join("")}</div>
        <p class="small">Si adatta a te: se completi spesso sale un po', se salti torna più leggera.</p>`

    </div>
    <div class="card">
      <h3>Per categoria</h3>
      <div class="bars">${per.map(p => `<div class="bar">${catIcon(p.c.id)}<div class="bt"><span>${esc(p.c.name)}</span><div class="meter" aria-hidden="true"><i style="width:${Math.round(p.n / max * 100)}%"></i></div></div><output aria-label="${esc(p.c.name)}: ${p.n}">${p.n}</output></div>`).join("")}</div>
    </div>
    <div class="sec-h"><h3>Traguardi</h3><span class="label">${Object.keys(S.badges).length} di ${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b => { const got = S.badges[b.id];
      return `<div class="badge ${got ? "" : "lock"}"><span class="bi">${got ? ICON[b.icon] : ICON.lock}</span><b>${esc(b.name)}</b><span>${got ? "Ottenuto il " + esc(fmtDay(got, {day:"numeric", month:"short"})) : esc(b.how)}</span></div>`; }).join("")}</div>
    <div class="sec-h"><h3>Guardaroba di Ranocchia</h3><span class="label">${S.acc.length} di ${ACC.length}</span></div>
    <p class="small" style="margin-bottom:10px">Gli accessori arrivano a sorpresa dopo le sfide. Tocca per farglieli indossare.</p>
    <div class="wardrobe">
      <button class="wb" data-w="" aria-pressed="${!S.wear}">${mascot("hi", 60, null)}Niente</button>
      ${ACC.map(a => { const has = S.acc.includes(a.id);
        return `<button class="wb" data-w="${a.id}" aria-pressed="${S.wear === a.id}" ${has ? "" : "disabled"}>${mascot("hi", 60, has ? a.id : null)}${has ? esc(a.name) : "Da scoprire"}</button>`; }).join("")}
    </div>
  </div>`);
  v.querySelectorAll(".wb:not(:disabled)").forEach(b => b.onclick = () => { S.wear = b.dataset.w || null; save(); progress(); });
  v.appendChild(tabBar("progress"));
  mount(v);
}

      <button class="opt" data-diff="manual" aria-pressed="${S.diff !== "auto"}">Scelgo io</button>
    </div>
    ${S.diff !== "auto" ? `<div class="opts" role="group" aria-label="Livelli ammessi" style="margin-top:10px">${[1,2,3].map(l => `<button class="opt" data-lv="${l}" aria-pressed="${S.levels.includes(l)}">${LV[l].name}<span class="ck">${ICON.check}</span></button>`).join("")}</div>` : `<p class="small" style="margin-top:8px">Se completi spesso arrivano sfide un po' più impegnative, se salti torna più leggera.</p>`}
    <div class="stack" style="margin-top:14px">
      ${sw("tog", S.together, "Sfide da fare con qualcuno", "Alcune sfide coinvolgono un amico o una persona cara")}
    </div>
    ${th ? `<div class="card" style="margin-top:14px"><p><b>${esc(THEMES[th.c])}</b> fino a ${esc(fmtDay(th.to))}.</p><div class="acts"><button class="btn btn-ghost" id="endth">Termina il tema</button></div></div>` : ""}

    <div class="sec-h"><h3>Le mie sfide</h3><span class="label">${(S.custom || []).length}</span></div>
    <button class="btn btn-ghost" id="mine">${ICON.plus}Aggiungi o modifica le tue sfide</button>

    <div class="sec-h"><h3>Promemoria</h3></div>
    <div class="field">
      <label for="rem">Orario del promemoria</label>
      <input class="in" type="time" id="rem" value="${esc(S.remind)}">
      <span class="help">Un'app web non può svegliare il telefono da sola: il modo più affidabile è aggiungere un evento ricorrente al calendario. Il tono resta gentile, nessun richiamo se salti.</span>
    </div>
    <div class="stack">
      <button class="btn btn-ghost" id="ics">${ICON.cal}Aggiungi al calendario</button>
      ${notifOk ? sw("ntf", S.notif && Notification.permission === "granted", "Avviso quando l'app è aperta", "Se l'app è aperta in sottofondo all'orario scelto") : ""}
    </div>

    <div class="sec-h"><h3>Colori</h3><span class="label">Tocca per provarli</span></div>
    <div class="pals">${PALETTES.map(p => `<button class="pal" data-id="${p.id}" aria-pressed="${p.id === S.palette}">
        <span class="sw" style="background:${p.bg}"><i style="background:${p.deep}"></i><b>Aa</b></span>
        <span class="pt2"><b>${esc(p.name)}</b><span>${esc(p.sub)}</span></span></button>`).join("")}</div>

    <div class="sec-h"><h3>I tuoi dati</h3></div>
    <div class="stack">
      <button class="btn btn-ghost" id="exp">${ICON.down}Esporta in JSON</button>
      <label class="btn btn-ghost" for="imp">${ICON.up}Importa da JSON<input type="file" id="imp" accept="application/json,.json" class="sr"></label>
      <p class="msg small" id="msg" role="status">${esc(note || "")}</p>
      <button class="btn btn-danger" id="reset">${ICON.trash}Ricomincia da zero</button>
    </div>
    <p class="foot">${ICON.eye}<span>Tutto resta su questo dispositivo: niente account, niente server, niente statistiche inviate.</span></p>
  </div>`);
  v.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    const id = b.dataset.cat, on = S.cats.includes(id);
    if(on && S.cats.length === 1){ toast("Tieni almeno una categoria attiva."); return; }
    S.cats = on ? S.cats.filter(x => x !== id) : S.cats.concat(id);
    refreshToday(); save(); settings();
  });
  v.querySelectorAll("[data-diff]").forEach(b => b.onclick = () => { S.diff = b.dataset.diff; save(); settings(); });
  v.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => {
    const l = Number(b.dataset.lv), on = S.levels.includes(l);
    if(on && S.levels.length === 1){ toast("Tieni almeno un livello."); return; }
    S.levels = on ? S.levels.filter(x => x !== l) : S.levels.concat(l).sort();
    save(); settings();
  });
  v.querySelector("#tog").onclick = () => { S.together = !S.together; refreshToday(); save(); settings(); };
  const e = v.querySelector("#endth"); if(e) e.onclick = () => { S.theme = null; save(); settings(); };
  v.querySelector("#mine").onclick = mine;
  v.querySelector("#rem").onchange = (ev) => { S.remind = ev.target.value || "18:30"; S.notified = null; save(); toast("Orario salvato."); };
  v.querySelector("#ics").onclick = icsDownload;
  const n = v.querySelector("#ntf");
  if(n) n.onclick = () => {
    if(S.notif && Notification.permission === "granted"){ S.notif = false; save(); settings(); return; }
    Notification.requestPermission().then(p => { S.notif = p === "granted"; save(); settings(p === "granted" ? "Avviso attivo." : "Permesso non concesso: puoi usare il calendario."); }).catch(() => {});
  };
  v.querySelectorAll(".pal").forEach(b => b.onclick = () => { S.palette = b.dataset.id; save(); applyPalette(); settings(); });
  v.querySelector("#exp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type:"application/json"}));
    a.download = "ranocchia-backup-" + today() + ".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    settings("File esportato.");
  };
  v.querySelector("#imp").onchange = (ev) => {
    const f = ev.target.files[0]; if(!f) return;
    f.text().then(txt => {
      const d = JSON.parse(txt);
      if(!d || typeof d !== "object" || typeof d.days !== "object") throw new Error("formato");
      if(!confirm("Sostituire i dati di questo telefono con quelli del file?")) return settings();
      S = Object.assign(fresh(), d); save(); applyPalette(); settings("Dati importati: " + Object.keys(S.days).length + " giorni.");
    }).catch(() => settings("File non valido: non ho cambiato nulla."));
  };
  v.querySelector("#reset").onclick = () => {
    if(!confirm("Cancellare tutte le sfide, le note e i progressi? Non si può annullare. Se vuoi, prima esporta i dati.")) return;
    const pal = S.palette; S = fresh(); S.palette = pal; S.lastSeen = today(); save(); settings("Ripartito da zero.");
  };
  v.appendChild(tabBar("settings"));
  mount(v);
}
// se la sfida di oggi non è ancora stata girata e non rispetta più le scelte, ne pesca un'altra
function refreshToday(){
  const t = today(), r = S.days[t];
  if(r && r.st === "new"){ const c = chOf(r); if(!S.cats.includes(c.c) || (!S.together && c.i)) S.days[t] = newRec(draw([])); }
}
function icsDownload(){
  const [hh, mm] = (S.remind || "18:30").split(":");
  const d = today().replace(/-/g, ""), now = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const url = location.href.split("#")[0];
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ranocchia//IT","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:ranocchia-promemoria-" + d + "@ranocchia","DTSTAMP:" + now, "DTSTART:" + d + "T" + hh + mm + "00", "DURATION:PT10M", "RRULE:FREQ=DAILY",
    "SUMMARY:Ranocchia: la sfida di oggi", "DESCRIPTION:Una piccola sfida ti aspetta\\, quando ti va. " + url, "URL:" + url,
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Ranocchia","TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = "ranocchia-promemoria.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Apri il file per aggiungere il promemoria al calendario.");
}

/* ---------- LE MIE SFIDE ---------- */
function mine(note){
  screen({s:"mine"});
  const list = S.custom || [];
  const v = $(`<div class="pop">
    ${backBtn("Impostazioni")}
    <div class="page-h"><span class="label">Le mie sfide</span><h2>Inventane una</h2><p>Piccola, concreta, da 2 a 15 minuti. Entra nel mazzo con le altre.</p></div>
    <form class="card" id="f" novalidate>
      <div class="field"><label for="ft">Titolo *</label><input class="in" id="ft" maxlength="60" required aria-describedby="ft-e"><span class="err" id="ft-e"></span></div>
      <div class="field"><label for="fd">Cosa fare, in una riga *</label><input class="in" id="fd" maxlength="140" required aria-describedby="fd-h fd-e"><span class="help" id="fd-h">Un'azione chiara: «Scrivi a…», non «Coltiva…».</span><span class="err" id="fd-e"></span></div>
      <div class="field"><label for="fc">Categoria</label><select class="in" id="fc">${CATS.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="fl">Livello</label><select class="in" id="fl">${[1,2,3].map(l => `<option value="${l}">${LV[l].name}</option>`).join("")}</select></div>
      <div class="field"><label for="fm">Minuti</label><input class="in" id="fm" type="number" inputmode="numeric" min="2" max="15" value="5" aria-describedby="fm-e"><span class="err" id="fm-e"></span></div>
      <div class="stack" style="margin-bottom:14px">${sw("fi", false, "Da fare con qualcuno")}</div>
      <button class="btn btn-deep" type="submit">${ICON.plus}Aggiungi al mazzo</button>
      <p class="small" role="status" style="margin-top:8px">${esc(note || "")}</p>
    </form>
    <div class="sec-h"><h3>Nel mazzo</h3><span class="label">${list.length}</span></div>
    ${list.length ? `<div class="card">${list.map(c => `<div class="mine"><div><b>${esc(c.t)}</b><span class="small">${esc(catName(c.c))} · ${LV[c.l].name} · ${c.m} min</span></div><button class="icb" data-del="${esc(c.id)}" aria-label="Elimina ${esc(c.t)}">${ICON.trash}</button></div>`).join("")}</div>`
      : `<p class="small">Ancora nessuna. La prima ti fa guadagnare un traguardo.</p>`}
  </div>`);
  let together = false;
  const fi = v.querySelector("#fi"); fi.onclick = (e) => { e.preventDefault(); together = !together; fi.setAttribute("aria-checked", together); };
  const err = (id, msg) => { const el = v.querySelector("#" + id); el.setAttribute("aria-invalid", msg ? "true" : "false"); v.querySelector("#" + id + "-e").textContent = msg; return !msg; };
  ["ft","fd","fm"].forEach(id => v.querySelector("#" + id).addEventListener("input", (e) => { if(e.target.getAttribute("aria-invalid") === "true") err(id, ""); }));
  v.querySelector("#f").onsubmit = (e) => {
    e.preventDefault();
    const t = v.querySelector("#ft").value.trim(), d = v.querySelector("#fd").value.trim(), m = Math.round(Number(v.querySelector("#fm").value));
    const a = err("ft", t ? "" : "Scrivi un titolo breve.");
    const b = err("fd", d ? "" : "Scrivi cosa fare, in una riga.");
    const c = err("fm", m >= 2 && m <= 15 ? "" : "Scegli un tempo da 2 a 15 minuti.");
    if(!(a && b && c)){ v.querySelector('[aria-invalid="true"]').focus(); return; }
    S.custom = list.concat({id:"u" + Date.now().toString(36), c:v.querySelector("#fc").value, l:Number(v.querySelector("#fl").value), o:999, t, d, m, w:"L'hai scelta tu: le sfide scelte in autonomia motivano di più.", i:together, own:true});
    checkBadges(); save(); mine("Aggiunta! Potrà uscire nei prossimi giorni.");
  };
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const c = list.find(x => x.id === b.dataset.del);
    if(!c || !confirm("Eliminare la sfida «" + c.t + "»? Le note nel diario restano.")) return;
    S.custom = list.filter(x => x.id !== c.id); save(); mine("Eliminata.");
  });
  v.querySelector("#bk").onclick = () => settings();
  mount(v);
}

/* ---------- promemoria quando l'app è aperta ---------- */
function reminderTick(){
  try{
    if(!S.notif || !("Notification" in window) || Notification.permission !== "granted") return;
    const now = new Date(), t = today(), hm = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
    const r = S.days[t];
    if(hm < S.remind || S.notified === t || (r && (r.st === "done" || r.st === "skip"))) return;
    S.notified = t; save();
    const opt = {body:"La sfida di oggi ti aspetta, quando ti va.", icon:"icon-192.png", tag:"ranocchia"};
    if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(reg => reg.showNotification("Ranocchia", opt));
    else new Notification("Ranocchia", opt);
  }catch(e){}
}

/* ---------- gesto indietro dal bordo (app installata su iPhone) ---------- */
(function edgeSwipe(){
  let x0 = null, y0 = 0; const arrow = document.createElement("div"); arrow.className = "edge"; arrow.innerHTML = ICON.back; document.body.appendChild(arrow);
  addEventListener("touchstart", e => { const t = e.touches[0]; if(t.clientX < 24 && curDepth > 0){ x0 = t.clientX; y0 = t.clientY; } else x0 = null; }, {passive:true});
  addEventListener("touchmove", e => { if(x0 === null) return; const dx = e.touches[0].clientX - x0; arrow.style.opacity = Math.min(1, dx / 70); arrow.style.transform = `translateX(${Math.min(dx, 80) - 20}px)`; }, {passive:true});
  addEventListener("touchend", e => { if(x0 === null) return; const t = e.changedTouches[0]; arrow.style.opacity = 0;
    if(t.clientX - x0 > 70 && Math.abs(t.clientY - y0) < 60) history.back(); x0 = null; });
})();

/* ---------- avvio ---------- */
(function start(){
  const t = today();
  if(S.lastSeen && S.lastSeen !== t){
    const g = gap(S.lastSeen, t);
    if(g >= 2){ sleepyOnce = true; S.lvl = Math.max(1, S.lvl - Math.min(.4, .1 * (g - 1))); }
  }
  S.lastSeen = t;
  checkBadges(); save();
})();

setInterval(reminderTick, 60000); reminderTick();

document.addEventListener("visibilitychange", () => { if(!document.hidden && today() !== lastDay){ lastDay = today(); S.lastSeen = lastDay; save(); if(curDepth === 0) home(); } });
window.APP = {mascot, PALETTES, CH, streak, draw, lvInfo, get S(){ return S; }, set S(v){ S = v; }, save, home, levelWeights};   // per scripts/icone.mjs e i test
})();

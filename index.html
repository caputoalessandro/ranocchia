<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranocchia</title>
<meta name="description" content="Ranocchia: one small daily challenge to step out of your comfort zone, with a frog that grows with you.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#6B3A8C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ranocchia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Stile fumetto piatto: colori pieni, contorni neri spessi, ombre piatte senza sfumature */
/* palette unica: "Tramonto sul lago" (albicocca, lilla e giallo) */
:root{
  --bg:#FBD9B4; --bg-shade:#E5AA6E; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#694320; --hair:rgba(26,26,26,.16);
  --deep:#6B3A8C; --deep-shade:#47245E; --on-deep:#FFFFFF; --soft:#FDEBD8; --accent:#FFE07A;
  --frog:#63B84A; --frog-shade:#3E8E2C; --belly:#E4F6C6; --cheek:#F49AB2;
  --good:#17703F; --good-bg:#C6EED3; --bad:#B0122C; --bad-bg:#FFD4D4;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --t-fast:.15s; --t-mid:.25s; --t-flip:.6s;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 130px}
button,input,select,textarea{font:inherit;color:inherit}
button,label.btn{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,label.btn:focus-within{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{overflow-wrap:anywhere;hyphens:auto}
h3{font-size:20px}
p{margin:0}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pop{animation:pop var(--t-mid) ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-5deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
@keyframes hop{0%{transform:translateY(12px) scale(.92)}60%{transform:translateY(-8px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* barra superiore */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:6px}
.logo{font-size:30px;font-weight:800;letter-spacing:-.01em;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--bg-shade);font-family:var(--f-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.4}
.chip svg{width:16px;height:16px;flex:none}
.chip.off{background:var(--soft)}

/* card principale con la mascotte */
/* fascia scura in alto che "cola" come inchiostro */
body{overflow-x:clip}
.band{background:var(--deep);color:#fff;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);margin-top:calc(-1 * max(20px,env(safe-area-inset-top,0px)));
  padding:max(20px,env(safe-area-inset-top,0px)) calc(50vw - 50%) 6px}
.band .label{color:#fff}
.band .chip{color:var(--ink);box-shadow:0 3px 0 #000}
#app:focus{outline:none}
.band .page-h{margin-bottom:6px}
.band .page-h h2{color:#fff}
.band .page-h p{color:#fff;opacity:.92}
.band .back{color:#fff}
.drip{display:block;width:100vw;max-width:none;height:auto;margin:-1px 0 14px calc(50% - 50vw)}
.drip path,.drip circle{fill:var(--deep)}
.avatar{width:136px;height:136px;flex:none;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 4px var(--deep),0 0 0 7px #fff}
.avatar .mascot{margin-top:14px}
.avatar.sm{width:52px;height:52px;border-width:2.5px;box-shadow:none}
.avatar.sm .mascot{margin-top:6px}
.hero{position:relative;color:var(--on-deep);display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:4px 0 0}
.hero .say{background:#fff;color:var(--ink);border:2.5px solid var(--ink);font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.3;padding:8px 12px;border-radius:16px 16px 4px 16px;margin-top:8px;align-self:center}
.hero .mascot{transform-origin:50% 100%}
.hero .mascot.wig{animation:wiggle 2.8s ease-in-out infinite}
.react{display:flex;justify-content:center;margin:4px 0 8px}
.react .mascot{animation:hop .45s ease-out}

/* pulsanti che si schiacciano */
.btn{border:3px solid var(--ink);border-radius:14px;min-height:52px;padding:12px 16px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;transition:transform var(--t-fast),box-shadow var(--t-fast)}
.btn svg{width:22px;height:22px;flex:none}
.btn-main{background:var(--bg);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.btn-deep{background:var(--deep);color:#fff;box-shadow:0 5px 0 var(--ink)}
.btn-accent{background:var(--accent);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.btn-accent:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
/* intro iniziale */
.intro{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;padding-bottom:24px}
.intro .band{display:flex;flex-direction:column;align-items:center;padding-bottom:18px}
.intro .skip{align-self:flex-end;background:none;border:0;color:#fff;font-weight:700;min-height:48px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.intro h2{font-size:30px;font-weight:500;line-height:1.2;margin-top:8px}
.intro h2 b{font-weight:800;text-transform:uppercase}
.intro p{margin-top:10px;font-size:18px}
.intro .row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:auto;padding-top:24px}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--ink);background:transparent}
.dots i.on{background:var(--accent);width:28px;border-radius:999px}
.round{width:96px;height:96px;border-radius:50%;border:3px solid var(--ink);background:var(--accent);color:var(--ink);font-weight:800;font-size:17px;box-shadow:0 5px 0 var(--ink);flex:none}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
/* bolle delle categorie */
.bubbles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.bub{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font-weight:700;font-size:15px;min-height:48px}
.bub .c{width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);background:var(--surface);display:grid;place-items:center;position:relative;box-shadow:0 4px 0 var(--bg-shade)}
.bub .c svg{width:30px;height:30px}
.bub[aria-pressed="true"] .c{background:var(--deep);color:#fff}
.bub .ok{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--accent);border:2.5px solid var(--ink);display:none;place-items:center;color:var(--ink)}
.bub .ok svg{width:15px;height:15px}
.bub[aria-pressed="true"] .ok{display:grid}
/* selettore a due schede */
.seg{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--ink);border-radius:999px;background:var(--surface);padding:4px;gap:4px;margin-bottom:16px}
.seg button{min-height:48px;border:0;border-radius:999px;background:none;font-weight:700;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--deep);color:#fff}
.btn-ghost{background:var(--surface);box-shadow:0 4px 0 var(--bg-shade)}
.btn-quiet{background:transparent;border-color:transparent;box-shadow:none;text-decoration:underline;text-underline-offset:3px}
.btn-danger{background:var(--bad-bg);color:var(--bad);box-shadow:0 4px 0 var(--bg-shade)}
.btn-main:active,.btn-deep:active,.btn-ghost:active,.btn-danger:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 var(--bg-shade);transform:none}
.acts{display:grid;gap:12px;margin-top:16px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* carta della sfida */
.flip{perspective:1400px;margin-bottom:8px}
.flip-in{position:relative;min-height:330px;transition:transform var(--t-flip) cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{transform:rotateY(180deg);overflow:hidden}
.cover{width:100%;height:100%;border:3px solid var(--ink);border-radius:22px;background:var(--deep);color:#fff;box-shadow:0 7px 0 var(--bg-shade);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.cover:active{transform:translateY(4px);box-shadow:0 3px 0 var(--bg-shade)}
.cover b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1}
.cover span{font-size:16px}
.cover svg.pads{width:150px;height:110px}
.ch{background:var(--surface);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--bg-shade);padding:18px;display:grid;gap:12px}
.face .ch{height:100%}
.ch h2{font-size:27px;font-weight:800}
.ch .d{font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);font-family:var(--f-mono);font-size:12.5px;background:var(--soft);line-height:1.5}
.tag svg{width:15px;height:15px;flex:none}
.tag.lv{background:var(--bg)}
.why{background:var(--soft);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:15.5px}
.why .label{display:block;margin-bottom:2px}
.plan{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:16px}
.plan svg{width:20px;height:20px;flex:none;margin-top:2px}
.stamp{display:inline-flex;align-items:center;gap:6px;justify-self:start;background:var(--good-bg);color:var(--good);border:2.5px solid var(--ink);border-radius:10px;padding:2px 10px;font-family:var(--f-display);font-weight:800;font-size:16px;transform:rotate(-2deg)}
.stamp svg{width:18px;height:18px}
.stamp.rest{background:var(--soft);color:var(--muted)}
.small{font-size:14px;color:var(--muted)}

/* card secondarie */
.card{background:var(--surface);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--bg-shade);padding:16px;margin-bottom:16px}
.card h3{margin-bottom:6px}
.card p+p{margin-top:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.page-h{margin-bottom:18px}
.page-h h2{font-size:32px;font-weight:800;margin-top:4px}
.page-h p{margin-top:4px;color:var(--muted)}
.back{background:none;border:0;min-height:48px;padding:8px 8px 8px 0;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:6px;font-size:16px;margin-bottom:6px}
.back svg{width:20px;height:20px}
.foot{margin-top:28px;color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.foot svg{width:18px;height:18px;flex:none;margin-top:2px}

/* scelte (chip grandi da toccare) */
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{min-height:48px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--surface);box-shadow:0 3px 0 var(--bg-shade);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;text-align:left;transition:transform var(--t-fast)}
.opt svg{width:20px;height:20px;flex:none}
.opt[aria-pressed="true"]{background:var(--deep);color:#fff;box-shadow:0 3px 0 var(--ink)}
.opt[aria-pressed="true"] .ck{display:inline}
.opt .ck{display:none}
.opt:active{transform:translateY(2px)}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.faceb{min-height:96px;border:3px solid var(--ink);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--bg-shade);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:15px;padding:8px 4px}
.faceb svg{width:44px;height:44px}
.faceb[aria-pressed="true"]{background:var(--bg);box-shadow:0 4px 0 var(--ink);outline:3px solid var(--deep);outline-offset:2px}

/* moduli */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .lab{font-weight:700}
.field .help{font-size:14px;color:var(--muted)}
.field .err{font-size:14px;color:var(--bad);font-weight:700}
.in{width:100%;min-height:52px;border:2.5px solid var(--ink);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:17px}
textarea.in{min-height:110px;resize:vertical}
.in[aria-invalid="true"]{border-color:var(--bad);background:#FFF5F5}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;width:100%;background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:8px 14px;text-align:left;font-weight:700;box-shadow:0 3px 0 var(--bg-shade)}
.switch .tr{width:52px;height:30px;border-radius:999px;border:2.5px solid var(--ink);background:var(--soft);position:relative;flex:none;transition:background var(--t-fast)}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--surface);border:2.5px solid var(--ink);transition:transform var(--t-fast)}
.switch[aria-checked="true"] .tr{background:var(--deep)}
.switch[aria-checked="true"] .tr::after{transform:translateX(22px)}
.switch small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.stack{display:grid;gap:12px}

/* calendario */
.cal-h{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin-bottom:10px}
.cal-h h3{text-align:center;text-transform:capitalize}
.icb{width:48px;height:48px;border:2.5px solid var(--ink);border-radius:12px;background:var(--surface);box-shadow:0 3px 0 var(--bg-shade);display:grid;place-items:center}
.icb svg{width:22px;height:22px}
.icb:disabled{opacity:.4}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-bottom:4px}
.cal .dd{display:grid;place-items:center;padding:2px 0}
.cal .dd i{width:min(38px,100%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;font-variant-numeric:tabular-nums;border:2.5px solid transparent}
.cal .dd.done i{background:var(--accent);border-color:var(--ink);font-weight:700}
.cal .dd.skip i{border:2.5px dashed var(--muted)}
.cal .dd.today i{background:var(--deep);color:#fff;border-color:var(--ink);font-weight:700}
.cal .dd.today.done i{box-shadow:0 0 0 3px var(--accent)}
.dot{width:16px;height:16px;border-radius:50%;display:block}
.dot.done{background:var(--accent);border:2.5px solid var(--ink)}
.dot.skip{border:2.5px dashed var(--muted);background:transparent}
.dot.today{background:var(--deep);border:2.5px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.entry{display:grid;gap:6px}
.entry+.entry{border-top:2px dashed var(--hair);padding-top:12px;margin-top:12px}
.entry .eh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.entry b{font-family:var(--f-display);font-size:18px;line-height:1.2}
.entry .note{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.mface{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.mface svg{width:24px;height:24px}

/* progressi */
.lvcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.meter{height:16px;border-radius:8px;background:var(--soft);border:2.5px solid var(--ink);overflow:hidden}
.meter i{display:block;height:100%;background:var(--deep)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--bg-shade);padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
.bar svg{width:24px;height:24px}
.bar .bt{display:grid;gap:4px;min-width:0}
.bar .bt span{font-weight:700;font-size:16px}
.bar output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;min-width:2ch;text-align:right}
.diffm{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;margin:8px 0 4px}
.diffm span{padding:6px 4px;text-align:center;font-size:14px;font-weight:700;background:var(--soft)}
.diffm span+span{border-left:2.5px solid var(--ink)}
.diffm span.on{background:var(--deep);color:#fff}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border:2.5px solid var(--ink);border-radius:16px;background:var(--surface);padding:10px;display:grid;justify-items:center;text-align:center;gap:4px;box-shadow:0 3px 0 var(--bg-shade)}
.badge .bi{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;background:var(--bg)}
.badge .bi svg{width:28px;height:28px}
.badge b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.badge span{font-size:13px;color:var(--muted);line-height:1.3}
.badge.lock{background:var(--soft);box-shadow:none;border-style:dashed}
.badge.lock .bi{background:var(--surface)}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.wb{border:2.5px solid var(--ink);border-radius:16px;background:var(--surface);box-shadow:0 3px 0 var(--bg-shade);padding:6px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:13px;font-weight:700;min-height:120px;text-align:center}
.wb[aria-pressed="true"]{background:var(--bg);outline:3px solid var(--deep);outline-offset:2px}
.wb:disabled{opacity:1;background:var(--soft);border-style:dashed;box-shadow:none;color:var(--muted);cursor:default}
.wb:disabled svg.mascot{opacity:.35}

/* impostazioni */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pal{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:2.5px solid var(--ink);border-radius:16px;padding:10px;box-shadow:0 4px 0 var(--bg-shade)}
.pal[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.sw{position:relative;height:58px;border-radius:10px;border:2.5px solid var(--ink);display:flex;align-items:center;padding:0 12px;overflow:hidden}

// sfide: id stabile = categoria + livello + posizione; testo nella lingua scelta

for(const c of Object.keys(RAW)) for(const l of [1,2,3]) RAW[c][l].forEach((s, i) => {
  const [t, d, m, w, f] = s.split("|");
  const [te, de, we] = (RAW_EN[c][l][i] || s).split("|");
  CH.push({id:c + l + "-" + String(i+1).padStart(2,"0"), c, l, o:i, m:Number(m), i:f === "i", tx:{it:{t, d, w}, en:{t:te, d:de, w:we}},

const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function today(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function toDate(k){ const [y, m, d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(k, n){ const d = toDate(k); d.setDate(d.getDate() + n); return today(d); }
function gap(a, b){ return Math.round((toDate(b) - toDate(a)) / 864e5); }
function weekKey(k){ const d = toDate(k); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return today(d); }
const fmtDay = (k, o) => toDate(k).toLocaleDateString(LOC(), o || {weekday:"long", day:"numeric", month:"long"});

  return {n, into:xp - acc, need, name:names[Math.min(n - 1, names.length - 1)]};

/* ---------- serie con "giorno jolly" (1 a settimana) ---------- */
function streak(){
  const t = today(), keys = Object.keys(S.days).sort();
  if(!keys.length) return {n:0, jolly:false};
  const first = keys[0];
  let d = dayDone(t) ? t : addDays(t, -1);
  let n = 0; const used = new Set(), saved = new Set();
  let pending = null;
  while(d >= first){
    if(dayDone(d)){ n++; if(pending){ saved.add(pending); pending = null; } }
    else { const w = weekKey(d); if(used.has(w)) break; used.add(w); pending = w; }
    d = addDays(d, -1);
  }
  return {n, jolly:saved.has(weekKey(t))};
}

/* ---------- scelta della sfida: autonomia + sfida ottimale + esposizione graduale ---------- */
function levelWeights(x){
  if(x < 1.5) return {1:.75, 2:.25, 3:0};
  if(x < 2)   return {1:.5, 2:.45, 3:.05};
  if(x < 2.5) return {1:.3, 2:.5, 3:.2};
  return {1:.15, 2:.45, 3:.4};
}
function activeTheme(){ const t = today(); return S.theme && t >= S.theme.from && t <= S.theme.to ? S.theme : null; }
function draw(exclude){
  const t = today(), done = new Set(), recent = new Set();
  for(const {k, r} of doneRecs()){ done.add(r.id); if(gap(k, t) <= 30) recent.add(r.id); }
  let pool = allCh().filter(c => (S.together || !c.i) && !exclude.includes(c.id) && S.cats.includes(c.c));
  if(!pool.length) pool = allCh().filter(c => !exclude.includes(c.id));
  if(!pool.length) pool = allCh();
  const allowed = S.diff === "auto" ? [1,2,3] : S.levels;
  const W = S.diff === "auto" ? levelWeights(S.lvl) : {1:1, 2:1, 3:1};
  const cats = [...new Set(pool.map(c => c.c))];
  const th = activeTheme();
  const cat = th && cats.includes(th.c) && Math.random() < .65 ? th.c : pick(cats);
  const catPool = pool.filter(c => c.c === cat);
  const lvAvail = [1,2,3].filter(l => allowed.includes(l) && catPool.some(c => c.l === l));
  let lv = null;
  if(lvAvail.length){
    const tot = lvAvail.reduce((a, l) => a + (W[l] || 0), 0);
    if(tot <= 0) lv = Math.min(...lvAvail);
    else { let r = Math.random() * tot; for(const l of lvAvail){ r -= W[l] || 0; if(r <= 0){ lv = l; break; } } lv = lv || lvAvail[lvAvail.length - 1]; }
  }
  let cand = lv ? catPool.filter(c => c.l === lv) : catPool;
  const notRecent = cand.filter(c => !recent.has(c.id)); if(notRecent.length) cand = notRecent;
  const never = cand.filter(c => !done.has(c.id));
  // sociale e coraggio: si sale per gradini, si propone il primo (o il secondo) gradino non ancora fatto
  if((cat === "soc" || lv === 3) && never.length) return pick(never.sort((a, b) => a.o - b.o).slice(0, 2));
  return pick(never.length ? never : cand);
}
function newRec(c, extra){ return Object.assign({id:c.id, t:c.t, c:c.c, l:c.l, st:"new", rr:0, plan:"", mood:0, note:"", xp:0, drawn:[c.id]}, extra || {}); }

function facts(){
  const ds = doneDays(), rs = doneRecs().map(x => x.r);
  let comeback = false;
  for(let i = 1; i < ds.length; i++) if(gap(ds[i-1], ds[i]) >= 4) comeback = true;
  let theme = false;
  if(S.theme) theme = doneRecs().filter(x => x.k >= S.theme.from && x.k <= S.theme.to && x.r.c === S.theme.c).length >= 4;
  return {done:rs.length, streak:Math.max(streak().n, S.best || 0), cats:new Set(rs.map(r => r.c)).size,
    brave:rs.filter(r => r.l === 3).length, notes:rs.filter(r => r.note).length,
    with:rs.filter(r => chOf(r).i).length, custom:(S.custom || []).length, comeback, theme,
    extra:ds.some(k => recsOf(k).filter(r => r.st === "done").length >= 2)};
}
function checkBadges(){
  const f = facts(), got = [];
  for(const b of BADGES) if(!S.badges[b.id] && b.ok(f)){ S.badges[b.id] = today(); got.push(b); }
  return got;
}

/* ---------- navigazione: il gesto "indietro" del telefono segue le schermate ---------- */
const DEPTH = {home:0, plan:1, reflect:1, yay:1, diary:1, progress:1, settings:1, recap:2, mine:2};
let curDepth = 0, fromPop = false, skipPop = null;
function screen(st){
  if(fromPop) return;
  const d = DEPTH[st.s];
  try{
    if(d > curDepth) history.pushState(st, "");
    else if(d === curDepth) history.replaceState(st, "");
    else { skipPop = st; history.go(d - curDepth); }
  }catch(e){}
  curDepth = d;
}
function showState(st){
  st = st || {s:"home"};
  const r = cur();
  if(st.s === "plan" && r && r.st === "flip") plan();
  else if(st.s === "reflect" && r && r.st === "ok") reflect();
  else if(st.s === "diary") diary(st.m, st.v);
  else if(st.s === "progress") progress();
  else if(st.s === "settings") settings();
  else if(st.s === "recap") recap();
  else if(st.s === "mine") mine();
  else home();
}
window.addEventListener("popstate", (e) => {
  if(skipPop){ const st = skipPop; skipPop = null; try{ history.replaceState(st, ""); }catch(err){} return; }
  let st = e.state || {s:"home"};
  if(st.s === "yay") st = {s:"home"};     // la festa non si riprende: si torna a Oggi
  fromPop = true;
  try{ showState(st); } finally { fromPop = false; }
  curDepth = DEPTH[st.s] || 0;
});
function mount(v, focus){
  const first = v.firstElementChild;
  if(first && first.matches(".back, .page-h") && !v.querySelector(".band")){
    const band = document.createElement("div"); band.className = "band";
    v.insertBefore(band, first);
    for(const el of [...v.children].slice(1, 3)) if(el.matches(".back, .page-h")) band.appendChild(el);
    band.insertAdjacentHTML("afterend", DRIP);
  }
  if(Date.now() - (toast.at || 0) > 400) document.getElementById("toast").classList.remove("on");
  app.innerHTML = ""; app.appendChild(v);
  v.querySelectorAll(".tabbar").forEach(el => app.appendChild(el));
  window.scrollTo(0, 0);
  if(focus !== false){ try{ app.focus({preventScroll:true}); }catch(e){} }
}
function tabBar(active){
  const tabs = [["home",tr("Oggi","Today"),ICON.card,home],["diary",tr("Diario","Diary"),ICON.book,() => diary()],["progress",tr("Progressi","Progress"),ICON.chart,progress],["settings",tr("Impostazioni","Settings"),ICON.gear,() => settings()]];
  const bar = $(`<nav class="tabbar" aria-label="${tr("Sezioni","Sections")}">${tabs.map(([id, l, ic]) => `<button class="tab ${id === active ? "on" : ""}" data-t="${id}" ${id === active ? 'aria-current="page"' : ""}>${ic}<span>${l}</span></button>`).join("")}</nav>`);
  bar.querySelectorAll(".tab").forEach(b => b.onclick = () => { if(b.dataset.t !== active) tabs.find(t => t[0] === b.dataset.t)[3](); else window.scrollTo({top:0, behavior:reduced() ? "auto" : "smooth"}); });
  return bar;
}

function complete(mood, note){

  if(!r || r.st === "done") return home();
  const before = lvInfo(totalXp()).n, firstEver = doneRecs().length === 0;
  r.st = "done"; r.mood = mood || 0; r.note = String(note || "").trim().slice(0, 600);
  r.xp = LV_XP[r.l] + (r.note ? 5 : 0); r.at = Date.now();
  S.lvl = Math.min(3, S.lvl + (r.x ? .05 : r.l >= Math.round(S.lvl) ? .2 : .1));
  S.best = Math.max(S.best || 0, streak().n);
  const badges = checkBadges();
  const after = lvInfo(totalXp()).n;
  // sorpresa: la prima volta sempre, poi circa 1 volta su 3. Mai a pagamento, mai con il timer.
  let surprise = null;
  const locked = ["cap","flower","glasses","bow","crown","leaf"].filter(a => !S.acc.includes(a));
  if(firstEver || Math.random() < .33){
    if(locked.length && (firstEver || Math.random() < .6)){ const a = pick(locked); S.acc.push(a); surprise = {type:"acc", a}; }
    else surprise = {type:"quote", i:Math.floor(Math.random() * X("quotes").length)};
  }
  save();
  yay({xp:r.xp, up:after > before ? after : 0, badges, surprise});

/* ---------- DIARIO ---------- */
function diary(m, view){
  const t = today();
  m = m || t.slice(0, 7); view = view === "list" ? "list" : "cal";
  screen({s:"diary", m, v:view});
  const [y, mo] = m.split("-").map(Number);
  const first = new Date(y, mo - 1, 1), days = new Date(y, mo, 0).getDate(), lead = (first.getDay() + 6) % 7;
  const prevM = today(new Date(y, mo - 2, 1)).slice(0, 7), nextM = today(new Date(y, mo, 1)).slice(0, 7);
  const firstKey = Object.keys(S.days).sort()[0];
  let cells = "";
  for(let i = 0; i < lead; i++) cells += "<span></span>";
  for(let d = 1; d <= days; d++){
    const k = m + "-" + String(d).padStart(2, "0"), r = S.days[k];
    const cls = r ? (dayDone(k) ? "done" : (r.st === "skip" || k < t) ? "skip" : "") : "";
    const lab = cls === "done" ? tr("sfida fatta","challenge done") : r && r.st === "skip" ? tr("riposo","rest day") : "";
    cells += `<span class="dd ${cls} ${k === t ? "today" : ""}" ${lab ? `aria-label="${d}: ${lab}"` : ""}><i>${d}</i></span>`;
  }
  const keys = Object.keys(S.days).filter(k => k.startsWith(m) && (dayDone(k) || S.days[k].st === "skip")).sort().reverse();
  const doneN = keys.reduce((a, k) => a + recsOf(k).filter(r => r.st === "done").length, 0);

// se la sfida di oggi non è ancora stata girata e non rispetta più le scelte, ne pesca un'altra
function refreshToday(){
  const r = cur();
  if(r && r.st === "new"){ const c = chOf(r); if(!S.cats.includes(c.c) || (!S.together && c.i)) replaceCur(newRec(draw(todayIds()), {x:!!r.x})); }
}
function icsDownload(){
  const [hh, mm] = (S.remind || "18:30").split(":");
  const d = today().replace(/-/g, ""), now = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const url = location.href.split("#")[0];
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ranocchia//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:ranocchia-reminder-" + d + "@ranocchia","DTSTAMP:" + now, "DTSTART:" + d + "T" + hh + mm + "00", "DURATION:PT10M", "RRULE:FREQ=DAILY",
    "SUMMARY:" + tr("Ranocchia: la sfida di oggi","Ranocchia: today's challenge"), "DESCRIPTION:" + tr("Una piccola sfida ti aspetta\\, quando ti va. ","A small challenge is waiting\\, whenever you like. ") + url, "URL:" + url,
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Ranocchia","TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = tr("ranocchia-promemoria.ics","ranocchia-reminder.ics"); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(tr("Apri il file per aggiungere il promemoria al calendario.","Open the file to add the reminder to your calendar."));
}

      <div class="field"><label for="ft">${tr("Titolo","Title")} *</label><input class="in" id="ft" maxlength="60" required aria-describedby="ft-e"><span class="err" id="ft-e"></span></div>
      <div class="field"><label for="fd">${tr("Cosa fare, in una riga","What to do, in one line")} *</label><input class="in" id="fd" maxlength="140" required aria-describedby="fd-h fd-e"><span class="help" id="fd-h">${tr("Un'azione chiara: «Scrivi a…», non «Coltiva…».","A clear action: “Write to…”, not “Nurture…”.")}</span><span class="err" id="fd-e"></span></div>
      <div class="field"><label for="fc">${tr("Categoria","Category")}</label><select class="in" id="fc">${CAT_IDS.map(c => `<option value="${c}">${esc(catName(c))}</option>`).join("")}</select></div>
      <div class="field"><label for="fl">${tr("Livello","Level")}</label><select class="in" id="fl">${[1,2,3].map(l => `<option value="${l}">${lvName(l)}</option>`).join("")}</select></div>
      <div class="field"><label for="fm">${tr("Minuti","Minutes")}</label><input class="in" id="fm" type="number" inputmode="numeric" min="2" max="15" value="5" aria-describedby="fm-e"><span class="err" id="fm-e"></span></div>
      <div class="stack" style="margin-bottom:14px">${sw("fi", false, tr("Da fare con qualcuno","To do with someone"))}</div>
      <button class="btn btn-accent" type="submit">${ICON.plus}${tr("Aggiungi al mazzo","Add to the deck")}</button>
      <p class="small" role="status" style="margin-top:8px">${esc(note || "")}</p>
    </form>
    <div class="sec-h"><h3>${tr("Nel mazzo","In the deck")}</h3><span class="label">${list.length}</span></div>
    ${list.length ? `<div class="card">${list.map(c => `<div class="mine"><div><b>${esc(c.t)}</b><span class="small">${esc(catName(c.c))} · ${lvName(c.l)} · ${c.m} min</span></div><button class="icb" data-del="${esc(c.id)}" aria-label="${tr("Elimina","Delete")} ${esc(c.t)}">${ICON.trash}</button></div>`).join("")}</div>`
      : `<p class="small">${tr("Ancora nessuna. La prima ti fa guadagnare un traguardo.","None yet. Your first one earns you a badge.")}</p>`}
  </div>`);
  let together = false;
  const fi = v.querySelector("#fi"); fi.onclick = (e) => { e.preventDefault(); together = !together; fi.setAttribute("aria-checked", together); };
  const err = (id, msg) => { const el = v.querySelector("#" + id); el.setAttribute("aria-invalid", msg ? "true" : "false"); v.querySelector("#" + id + "-e").textContent = msg; return !msg; };
  ["ft","fd","fm"].forEach(id => v.querySelector("#" + id).addEventListener("input", (e) => { if(e.target.getAttribute("aria-invalid") === "true") err(id, ""); }));
  v.querySelector("#f").onsubmit = (e) => {
    e.preventDefault();
    const t = v.querySelector("#ft").value.trim(), d = v.querySelector("#fd").value.trim(), m = Math.round(Number(v.querySelector("#fm").value));
    const a = err("ft", t ? "" : tr("Scrivi un titolo breve.","Write a short title."));
    const b = err("fd", d ? "" : tr("Scrivi cosa fare, in una riga.","Write what to do, in one line."));
    const c = err("fm", m >= 2 && m <= 15 ? "" : tr("Scegli un tempo da 2 a 15 minuti.","Pick a time from 2 to 15 minutes."));
    if(!(a && b && c)){ v.querySelector('[aria-invalid="true"]').focus(); return; }
    S.custom = list.concat({id:"u" + Date.now().toString(36), c:v.querySelector("#fc").value, l:Number(v.querySelector("#fl").value), o:999, t, d, m, w:"", i:together, own:true});
    checkBadges(); save(); mine(tr("Aggiunta! Potrà uscire nei prossimi giorni.","Added! It may come up in the next few days."));
  };
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const c = list.find(x => x.id === b.dataset.del);
    if(!c || !confirm(tr(`Eliminare la sfida «${c.t}»? Le note nel diario restano.`, `Delete the challenge “${c.t}”? Your diary notes stay.`))) return;
    S.custom = list.filter(x => x.id !== c.id); save(); mine(tr("Eliminata.","Deleted."));
  });
  v.querySelector("#bk").onclick = () => settings();
  mount(v);
}

/* ---------- promemoria quando l'app è aperta ---------- */
function reminderTick(){
  try{
    if(!S.notif || !("Notification" in window) || Notification.permission !== "granted") return;
    const now = new Date(), t = today(), hm = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
    const r = S.days[t];
    if(hm < S.remind || S.notified === t || dayDone(t) || (r && r.st === "skip")) return;
    S.notified = t; save();
    const opt = {body:tr("La sfida di oggi ti aspetta, quando ti va.","Today's challenge is waiting, whenever you like."), icon:"icon-192.png", tag:"ranocchia"};
    if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(reg => reg.showNotification("Ranocchia", opt));
    else new Notification("Ranocchia", opt);
  }catch(e){}
}

/* ---------- gesto indietro dal bordo (app installata su iPhone) ---------- */
(function edgeSwipe(){
  let x0 = null, y0 = 0; const arrow = document.createElement("div"); arrow.className = "edge"; arrow.innerHTML = ICON.back; document.body.appendChild(arrow);
  addEventListener("touchstart", e => { const t = e.touches[0]; if(t.clientX < 24 && curDepth > 0){ x0 = t.clientX; y0 = t.clientY; } else x0 = null; }, {passive:true});
  addEventListener("touchmove", e => { if(x0 === null) return; const dx = e.touches[0].clientX - x0; arrow.style.opacity = Math.min(1, dx / 70); arrow.style.transform = `translateX(${Math.min(dx, 80) - 20}px)`; }, {passive:true});
  addEventListener("touchend", e => { if(x0 === null) return; const t = e.changedTouches[0]; arrow.style.opacity = 0;
    if(t.clientX - x0 > 70 && Math.abs(t.clientY - y0) < 60) history.back(); x0 = null; });
})();

/* ---------- avvio ---------- */
(function start(){
  const t = today();
  if(S.lastSeen && S.lastSeen !== t){
    const g = gap(S.lastSeen, t);
    if(g >= 2){ sleepyOnce = true; S.lvl = Math.max(1, S.lvl - Math.min(.4, .1 * (g - 1))); }
  }
  S.lastSeen = t;
  checkBadges(); save();
})();
applyLook();
try{ history.replaceState({s:"home"}, ""); }catch(e){}
home();
setInterval(reminderTick, 60000); reminderTick();
let lastDay = today();
document.addEventListener("visibilitychange", () => { if(!document.hidden && today() !== lastDay){ lastDay = today(); S.lastSeen = lastDay; save(); if(curDepth === 0) home(); } });
window.APP = {mascot, PALETTES, CH, streak, draw, lvInfo, get S(){ return S; }, set S(v){ S = v; }, save, home, levelWeights, cur};   // per scripts/icone.mjs e i test
})();
